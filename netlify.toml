[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/leaderboard"
  to = "/.netlify/functions/leaderboard"
  status = 200

[[redirects]]
  from = "/api/presence"
  to = "/.netlify/functions/presence"
  status = 200

[[redirects]]
  from = "/api/world-event"
  to = "/.netlify/functions/world-event"
  status = 200

[[redirects]]
  from = "/api/world-spawn"
  to = "/.netlify/functions/world-spawn"
  status = 200
